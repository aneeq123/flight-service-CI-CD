name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Checkstyle
        run: ./mvnw checkstyle:check

      - name: Run tests and JaCoCo coverage check
        run: ./mvnw clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: flight-service-jar
          path: target/*.jar

  docker-build-deploy:
    runs-on: ubuntu-latest
    needs: build-test-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: flight-service-jar
          path: target

      - name: Check downloaded files
        run: ls -R target

      - name: Build Docker image
        run: docker build -t flight-service-cicd:latest .

      - name: Run Docker container
        run: docker run -d -p 8081:8081 --name flight-service-container flight-service-cicd:latest

      - name: Wait for application startup
        run: |
          for i in {1..12}; do
            if curl -f http://localhost:8081/api/flights; then
              echo "Application is running."
              exit 0
            fi
            echo "Waiting for application to start..."
            sleep 5
          done
          echo "Application failed to start in time."
          docker logs flight-service-container || true
          exit 1

      - name: Check running containers
        run: docker ps

      - name: Test deployed application
        run: curl -f http://localhost:8081/api/flights

      - name: Show container logs
        run: docker logs flight-service-container

      - name: Stop container
        if: always()
        run: docker stop flight-service-container || true

      - name: Remove container
        if: always()
        run: docker rm flight-service-container || true